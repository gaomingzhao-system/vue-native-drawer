name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:playground
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Prepare base revision
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach ../drawer-baseline "$BASE_REVISION"

      - run: npm ci && npm run build
        working-directory: ../drawer-baseline

      - name: Compare rendering and bundle sizes
        run: |
          node scripts/benchmark.mjs ../drawer-baseline > "$RUNNER_TEMP/drawer-benchmark.json"
          cat "$RUNNER_TEMP/drawer-benchmark.json"

      - uses: actions/upload-artifact@v7
        with:
          name: drawer-benchmark
          path: ${{ runner.temp }}/drawer-benchmark.json
          retention-days: 7
